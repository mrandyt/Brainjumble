name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add the Brain Jumble icon
        run: cp -r resources/android/res/* android/app/src/main/res/

      - name: Use the repo's signing key so new builds install over old ones
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BrainJumble.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BrainJumble-apk
          path: BrainJumble.apk

      - name: Publish as the "latest" release (easy download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BrainJumble.apk \
            --title "Brain Jumble $(node -p "require('./package.json').version") (latest build)" \
            --notes "$(cat RELEASE_NOTES.md; echo; echo "Built from ${GITHUB_SHA::7}.")"
