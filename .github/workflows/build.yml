name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Also send the update notification now, even if the version number hasn't changed"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Stamp the app version from package.json
        run: echo "export const APP_VERSION = \"$(node -p "require('./package.json').version")\";" > www/version.js

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Sign with the repo key and raise the version code
        run: node tools/configure-android.mjs $((100 + ${{ github.run_number }}))

      - name: Add the Brain Jumble icon
        run: cp -r resources/android/res/* android/app/src/main/res/

      - name: Add the Firebase config (needed for update notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase config added: update notifications are on in this build"
          else
            echo "No GOOGLE_SERVICES_JSON secret yet: building without update notifications"
          fi

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BrainJumble.apk

      - name: Check it's signed with the repo key (otherwise updates won't install)
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs BrainJumble.apk | tee certs.txt
          grep -qi "SHA-256 digest: f92a22f102b98d0ff92ca1e2dc9072c641af0cc5111543ca2f3dcf905591d883" certs.txt \
            || { echo "::error::APK is not signed with signing/debug.keystore"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: BrainJumble-apk
          path: BrainJumble.apk

      - name: Publish as the "latest" release (easy download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "PREV_NAME=$(gh api repos/${{ github.repository }}/releases/tags/latest --jq .name 2>/dev/null || true)" >> "$GITHUB_ENV"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BrainJumble.apk \
            --title "Brain Jumble $(node -p "require('./package.json').version") (latest build)" \
            --notes "$(cat RELEASE_NOTES.md; echo; echo "Built from ${GITHUB_SHA::7}.")"

      - name: Notify every phone when the version number changes
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_PUSH: ${{ github.event.inputs.test_notification }}
        run: |
          NEW=$(node -p "require('./package.json').version")
          if [ "$TEST_PUSH" != "true" ] && echo "$PREV_NAME" | grep -q "Brain Jumble $NEW "; then echo "Same version as before ($NEW): no notification"; exit 0; fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "No FIREBASE_SERVICE_ACCOUNT secret yet: skipping the notification"; exit 0; fi
          mkdir -p /tmp/push && cp tools/send-update-push.mjs /tmp/push/ && cd /tmp/push
          npm init -y >/dev/null && npm pkg set type=module >/dev/null && npm install google-auth-library@9 >/dev/null
          node send-update-push.mjs "$NEW"
