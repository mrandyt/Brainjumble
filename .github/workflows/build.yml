name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Stamp the app version from package.json
        run: echo "export const APP_VERSION = \"$(node -p "require('./package.json').version")\";" > www/version.js

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Sign with the repo key and raise the version code
        run: node tools/configure-android.mjs $((100 + ${{ github.run_number }}))

      - name: Add the Brain Jumble icon
        run: cp -r resources/android/res/* android/app/src/main/res/

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BrainJumble.apk

      - name: Check it's signed with the repo key (otherwise updates won't install)
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs BrainJumble.apk | tee certs.txt
          grep -qi "SHA-256 digest: f92a22f102b98d0ff92ca1e2dc9072c641af0cc5111543ca2f3dcf905591d883" certs.txt \
            || { echo "::error::APK is not signed with signing/debug.keystore"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: BrainJumble-apk
          path: BrainJumble.apk

      - name: Publish as the "latest" release (easy download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BrainJumble.apk \
            --title "Brain Jumble $(node -p "require('./package.json').version") (latest build)" \
            --notes "$(cat RELEASE_NOTES.md; echo; echo "Built from ${GITHUB_SHA::7}.")"
