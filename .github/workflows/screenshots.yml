name: Update README screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "tools/screenshots.mjs"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install a browser and colour emoji
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji
          mkdir -p /tmp/shots && cd /tmp/shots && npm init -y >/dev/null && npm install playwright@1.48.2
          cd /tmp/shots && npx playwright install --with-deps chromium

      - name: Take the screenshots
        run: |
          (cd www && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          cp tools/screenshots.mjs /tmp/shots/screenshots.mjs
          cd /tmp/shots && node screenshots.mjs
          mkdir -p "$GITHUB_WORKSPACE/docs" && cp -r /tmp/shots/docs/screenshots "$GITHUB_WORKSPACE/docs/"

      - name: Commit them if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update README screenshots [skip ci]"
          git push
